<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RMS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast-region"></div>

  <main id="auth-screen" class="auth-shell">
    <section class="auth-visual">
      <div class="visual-content">
        <div class="brand brand-light">RMS<span>.</span></div>
        <div class="visual-copy">
          <h1>Operations Portal</h1>
          <p>Manage shifts, payroll, stock, and sales.</p>
        </div>
      </div>
    </section>

    <section class="auth-panel">
      <div class="auth-card">
        <div class="brand brand-dark">RMS<span>.</span></div>
        <div id="auth-debug-msg" style="display:none;background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px;margin-bottom:12px;font-size:13px;"></div>

        <div class="auth-tabs">
          <button type="button" id="tab-login" class="auth-tab active" onclick="switchAuthTab('login')">Sign in</button>
          <button type="button" id="tab-signup" class="auth-tab" onclick="switchAuthTab('signup')">Create account</button>
        </div>

        <section id="login-form-wrap">
          <h2>Sign in</h2>
          <button type="button" id="google-login" class="google-btn" onclick="startGoogleLogin()">
            <span class="google-mark">G</span>Continue with Google
          </button>
          <div class="or-line"><span>OR</span></div>
          <form id="login-form" class="form-stack">
            <label>Email <input name="email" type="email" required></label>
            <label>Password <input name="password" type="password" required></label>
            <button class="btn btn-primary full" type="submit">Sign in</button>
          </form>
        </section>

        <section id="signup-form-wrap" class="hidden">
          <h2>Create account</h2>
          <button type="button" id="google-signup" class="google-btn" onclick="startGoogleLogin()">
            <span class="google-mark">G</span>Sign up with Google
          </button>
          <div class="or-line"><span>OR</span></div>
          <form id="signup-form" class="form-stack">
            <label>Full name <input name="name" type="text" required></label>
            <label>Email <input name="email" type="email" required></label>
            <label>Password <input name="password" type="password" minlength="8" required></label>
            <button class="btn btn-primary full" type="submit">Create account</button>
          </form>
        </section>
      </div>
    </section>
  </main>

  <div id="app-shell" class="app-shell hidden">
    <aside class="sidebar" id="sidebar">
      <a class="side-brand" href="#dashboard">
        <span class="brand">RMS<span>.</span></span>
      </a>
      <div class="side-user">
        <div class="avatar" id="user-avatar">R</div>
        <div>
          <strong id="user-name">User</strong>
          <small id="user-email"></small>
        </div>
      </div>
      <nav class="side-nav" id="side-nav">
        <button type="button" class="nav-link manager-only active" data-page="dashboard">Dashboard</button>
        <button type="button" class="nav-link manager-only" data-page="shifts">Staff & Shifts</button>
        <button type="button" class="nav-link manager-only" data-page="payroll">Payroll</button>
        <button type="button" class="nav-link manager-only" data-page="menu">Inventory</button>
        <button type="button" class="nav-link manager-only" data-page="orders">Orders</button>
        <button type="button" class="nav-link manager-only" data-page="reports">Reports</button>
        <button type="button" class="nav-link staff-only hidden" data-page="portal">My Portal</button>
      </nav>
      <div class="sidebar-bottom">
        <button type="button" id="logout-btn" class="logout-btn">Sign out</button>
      </div>
    </aside>

    <section class="main-area">
      <header class="topbar">
        <button type="button" id="menu-toggle" class="mobile-menu">☰</button>
        <div><small id="top-date"></small></div>
        <div class="topbar-right"><div class="top-avatar" id="top-avatar">R</div></div>
      </header>
      <main id="page-content" class="page-content">
        <div class="loading-state">Loading…</div>
      </main>
    </section>
  </div>

  <script>
    function showAuthError(msg) {
      var box = document.getElementById('auth-debug-msg');
      if (box) { box.style.display = 'block'; box.textContent = msg; }
    }
    function switchAuthTab(tab) {
      var isSignup = tab === 'signup';
      document.getElementById('login-form-wrap').classList.toggle('hidden', isSignup);
      document.getElementById('signup-form-wrap').classList.toggle('hidden', !isSignup);
      document.getElementById('tab-login').classList.toggle('active', !isSignup);
      document.getElementById('tab-signup').classList.toggle('active', isSignup);
    }
    function startGoogleLogin() {
      var cfg = window.RMS_CONFIG || {};
      if (!window.supabase) return showAuthError('Still loading database library. Wait 2 seconds and click again.');
      if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY) return showAuthError('Missing keys in config.js.');
      var sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
      sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + window.location.pathname }
      }).then(function(r) { if (r.error) showAuthError(r.error.message); });
    }
  </script>

  <script src="config.js?v=9"></script>
  <script type="module">
    import { createClient } from 'https://esm.sh';
    window.supabase = { createClient };
    const s = document.createElement('script');
    s.src = 'app.js?v=9';
    document.body.appendChild(s);
  </script>
</body>
</html>
